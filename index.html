
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Canon Parallax</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101010;
      font-family: Arial, sans-serif;
    }

    #camera {
      display: block;
      width: 100%;
      height: 100%;
    }

    #controles {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: min(80%, 500px);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
      border-radius: 15px;
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(12px);
    }

    #testeScroll {
      width: 100%;
      cursor: pointer;
      accent-color: #ffffff;
    }

    #contador {
      color: #ffffff;
      font-size: 12px;
      white-space: nowrap;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 12px;
      z-index: 1000;
      text-align: center;
      pointer-events: none;
    }
    #controles {
  display: none;
}
  </style>
</head>

<body>

  <canvas id="camera"></canvas>

  <div id="status">Carregando imagens...</div>

  <div id="controles">
    <input
      id="testeScroll"
      type="range"
      min="0"
      max="99"
      value="0"
      step="1"
      aria-label="Controlar frames da câmera"
    >

    <span id="contador">1 / 100</span>
  </div>

  <script>
    const TOTAL_FRAMES = 100;

    const canvas = document.getElementById("camera");
    const ctx = canvas.getContext("2d");

    const slider = document.getElementById("testeScroll");
    const contador = document.getElementById("contador");
    const status = document.getElementById("status");

    const frames = new Array(TOTAL_FRAMES);

    let currentFrame = 0;
    let targetFrame = 0;
    let loadedFrames = 0;
    let failedFrames = 0;

    // CARREGAMENTO DAS IMAGENS

    for (let i = 1; i <= TOTAL_FRAMES; i++) {
      const img = new Image();

      frames[i - 1] = img;

      img.onload = () => {
        loadedFrames++;

        if (i === 1) {
          render();
        }

        updateStatus();
      };

      img.onerror = () => {
        failedFrames++;
        console.error(
          "Erro ao carregar:",
          `Imagem-${i}.webp`
        );

        updateStatus();
      };

      img.src = `Imagem-${i}.webp`;
    }

    function updateStatus() {
      const processed = loadedFrames + failedFrames;

      if (processed === TOTAL_FRAMES) {
        if (failedFrames === 0) {
          status.textContent = "";
        } else {
          status.textContent =
            `${failedFrames} imagem(ns) não carregada(s).`;
        }
      } else {
        status.textContent =
          `Carregando ${processed} / ${TOTAL_FRAMES}`;
      }
    }

    // DESENHAR FRAME

    function render() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;

      if (width === 0 || height === 0) return;

      const dpr = Math.min(
        window.devicePixelRatio || 1,
        2
      );

      const pixelWidth = Math.round(width * dpr);
      const pixelHeight = Math.round(height * dpr);

      if (
        canvas.width !== pixelWidth ||
        canvas.height !== pixelHeight
      ) {
        canvas.width = pixelWidth;
        canvas.height = pixelHeight;
      }

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);

      const index = Math.max(
        0,
        Math.min(
          TOTAL_FRAMES - 1,
          Math.round(currentFrame)
        )
      );

      const img = frames[index];

      if (
        !img ||
        !img.complete ||
        !img.naturalWidth
      ) {
        return;
      }

      const scale = Math.min(
        width / img.naturalWidth,
        height / img.naturalHeight
      );

      const w = img.naturalWidth * scale;
      const h = img.naturalHeight * scale;

      ctx.drawImage(
        img,
        (width - w) / 2,
        (height - h) / 2,
        w,
        h
      );

      contador.textContent =
        `${index + 1} / ${TOTAL_FRAMES}`;
    }

    // ANIMAÇÃO SUAVE

    function animate() {
      currentFrame +=
        (targetFrame - currentFrame) * 0.18;

      if (
        Math.abs(targetFrame - currentFrame) < 0.05
      ) {
        currentFrame = targetFrame;
      }

      render();

      requestAnimationFrame(animate);
    }

    // CONTROLE PELO SLIDER

    slider.addEventListener("input", function () {
      targetFrame = Number(this.value);
    });

    // CONTROLE EXTERNO POR PROGRESSO

    window.addEventListener("message", (event) => {
      if (
        event.data?.type === "PARALLAX_PROGRESS"
      ) {
        const progress = Math.max(
          0,
          Math.min(
            1,
            Number(event.data.progress) || 0
          )
        );

        targetFrame =
          progress * (TOTAL_FRAMES - 1);

        slider.value = Math.round(targetFrame);
      }
    });

    // REDIMENSIONAMENTO

    window.addEventListener("resize", render);

    // INICIAR

    animate();
  </script>

</body>
</html>
