
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FlyGarden | Product Parallax</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101010;
    }

    #camera {
      display: block;
      width: 100%;
      height: 100%;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font: 12px Arial, sans-serif;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    #controles {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: min(85%, 520px);
      display: none;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
      border-radius: 15px;
      background: rgba(20, 20, 20, 0.8);
      z-index: 20;
    }

    #testeScroll {
      width: 100%;
      cursor: pointer;
      accent-color: white;
    }

    #contador {
      color: white;
      font: 12px Arial, sans-serif;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <canvas id="camera"></canvas>

  <div id="status">Carregando imagens...</div>

  <div id="controles">
    <input
      id="testeScroll"
      type="range"
      min="0"
      max="100"
      value="0"
      step="1"
      aria-label="Controlar animação"
    >
    <span id="contador">1 / 50</span>
  </div>

  <script>

    // =====================================
    // CONFIGURAÇÃO DOS PRODUTOS
    // =====================================

    const PRODUCTS = {
      canon: {
        folder: "R5MKII",
        prefix: "Imagem-",
        count: 50,
        ext: "webp",
        reverse: true
      },

      drone: {
        folder: "drone",
        prefix: "IMG360_",
        count: 50,
        ext: "webp",
        reverse: true
      }
    };

    // =====================================
    // SELEÇÃO DO PRODUTO
    // =====================================

    const params = new URLSearchParams(
      window.location.search
    );

    const productName =
      params.get("produto") || "canon";

    const TEST_MODE =
      params.get("teste") === "1";

    const product =
      Object.prototype.hasOwnProperty.call(
        PRODUCTS,
        productName
      )
        ? PRODUCTS[productName]
        : PRODUCTS.canon;

    const TOTAL_FRAMES = product.count;

    // =====================================
    // ELEMENTOS
    // =====================================

    const canvas =
      document.getElementById("camera");

    const ctx =
      canvas.getContext("2d");

    const slider =
      document.getElementById("testeScroll");

    const contador =
      document.getElementById("contador");

    const status =
      document.getElementById("status");

    const controles =
      document.getElementById("controles");

    const frames =
      new Array(TOTAL_FRAMES);

    let currentFrame = 0;
    let targetFrame = 0;

    let loadedFrames = 0;
    let failedFrames = 0;

    let lastRenderedFrame = -1;

    if (TEST_MODE) {
      controles.style.display = "flex";
    }

    // =====================================
    // CAMINHO DAS IMAGENS
    // =====================================

    function getFramePath(number) {
      const filename =
        `${product.prefix}${number}.${product.ext}`;

      if (
        product.folder === "." ||
        product.folder === ""
      ) {
        return filename;
      }

      return `${product.folder}/${filename}`;
    }

    // =====================================
    // PROGRESSO DA ANIMAÇÃO
    // =====================================

    function setProgress(value) {

      const progress = Math.max(
        0,
        Math.min(1, Number(value) || 0)
      );

      // 0%   = frame 1
      // 50%  = frame 50
      // 100% = frame 1

      const playbackProgress = product.reverse
        ? 1 - Math.abs(2 * progress - 1)
        : progress;

      targetFrame =
        playbackProgress * (TOTAL_FRAMES - 1);
    }

    // =====================================
    // CARREGAMENTO DAS IMAGENS
    // =====================================

    function loadFrames() {

      for (let i = 1; i <= TOTAL_FRAMES; i++) {

        const img = new Image();

        frames[i - 1] = img;

        img.onload = () => {
          loadedFrames++;
          updateStatus();
          lastRenderedFrame = -1;
        };

        img.onerror = () => {
          failedFrames++;

          console.error(
            "Erro ao carregar:",
            getFramePath(i)
          );

          updateStatus();
        };

        img.src = getFramePath(i);
      }
    }

    // =====================================
    // STATUS
    // =====================================

    function updateStatus() {

      const processed =
        loadedFrames + failedFrames;

      if (processed === TOTAL_FRAMES) {

        status.textContent =
          failedFrames === 0
            ? ""
            : `${failedFrames} imagem(ns) não carregada(s)`;

      } else {

        status.textContent =
          `Carregando ${processed} / ${TOTAL_FRAMES}`;

      }
    }

    // =====================================
    // DIMENSIONAMENTO
    // =====================================

    function resizeCanvas() {

      const width = canvas.clientWidth;
      const height = canvas.clientHeight;

      const dpr = Math.min(
        window.devicePixelRatio || 1,
        2
      );

      const pixelWidth =
        Math.round(width * dpr);

      const pixelHeight =
        Math.round(height * dpr);

      if (
        canvas.width !== pixelWidth ||
        canvas.height !== pixelHeight
      ) {

        canvas.width = pixelWidth;
        canvas.height = pixelHeight;

        lastRenderedFrame = -1;
      }
    }

    // =====================================
    // RENDERIZAÇÃO
    // =====================================

    function render() {

      resizeCanvas();

      const width = canvas.clientWidth;
      const height = canvas.clientHeight;

      if (width <= 0 || height <= 0) {
        return;
      }

      const index = Math.max(
        0,
        Math.min(
          TOTAL_FRAMES - 1,
          Math.round(currentFrame)
        )
      );

      const img = frames[index];

      if (
        !img ||
        !img.complete ||
        !img.naturalWidth
      ) {
        return;
      }

      if (index === lastRenderedFrame) {
        return;
      }

      const dpr = Math.min(
        window.devicePixelRatio || 1,
        2
      );

      ctx.setTransform(
        dpr, 0, 0, dpr, 0, 0
      );

      ctx.clearRect(
        0, 0, width, height
      );

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";

      const scale = Math.min(
        width / img.naturalWidth,
        height / img.naturalHeight
      );

      const w = img.naturalWidth * scale;
      const h = img.naturalHeight * scale;

      ctx.drawImage(
        img,
        (width - w) / 2,
        (height - h) / 2,
        w,
        h
      );

      lastRenderedFrame = index;

      contador.textContent =
        `${index + 1} / ${TOTAL_FRAMES}`;
    }

    // =====================================
    // MOVIMENTO SUAVE
    // =====================================

    function animate() {

      currentFrame +=
        (targetFrame - currentFrame) * 0.18;

      if (
        Math.abs(targetFrame - currentFrame) < 0.05
      ) {
        currentFrame = targetFrame;
      }

      render();

      requestAnimationFrame(animate);
    }

    // =====================================
    // CONTROLE MANUAL DE TESTE
    // =====================================

    slider.addEventListener("input", function () {
      setProgress(Number(this.value) / 100);
    });

    // =====================================
    // RECEBER SCROLL DO WIX STUDIO
    // =====================================

    window.addEventListener("message", (event) => {

      if (
        event.data?.type !==
        "PARALLAX_PROGRESS"
      ) {
        return;
      }

      const progress =
        Number(event.data.progress);

      if (!Number.isFinite(progress)) {
        return;
      }

      setProgress(progress);

      slider.value =
        Math.round(
          Math.max(0, Math.min(1, progress)) * 100
        );
    });

    // =====================================
    // REDIMENSIONAMENTO
    // =====================================

    window.addEventListener("resize", () => {
      lastRenderedFrame = -1;
      render();
    });

    // =====================================
    // INICIAR
    // =====================================

    loadFrames();
    animate();

  </script>

</body>
</html>
