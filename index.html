
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101010;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="camera"></canvas>

<script>
const TOTAL_FRAMES = 100;
const canvas = document.getElementById("camera");
const ctx = canvas.getContext("2d");

const frames = [];
let currentFrame = 0;
let targetFrame = 0;

for (let i = 1; i <= TOTAL_FRAMES; i++) {
  const img = new Image();
  img.src = `Imagem-${i}.webp`;
  img.onload = () => {
    if (i === 1) render();
  };
  frames.push(img);
}

function render() {
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);

  const img = frames[Math.round(currentFrame)];
  if (!img || !img.complete || !img.naturalWidth) return;

  const scale = Math.min(
    width / img.naturalWidth,
    height / img.naturalHeight
  );

  const w = img.naturalWidth * scale;
  const h = img.naturalHeight * scale;

  ctx.drawImage(
    img,
    (width - w) / 2,
    (height - h) / 2,
    w,
    h
  );
}

function animate() {
  currentFrame += (targetFrame - currentFrame) * 0.18;

  if (Math.abs(targetFrame - currentFrame) < 0.05) {
    currentFrame = targetFrame;
  }

  render();
  requestAnimationFrame(animate);
}

window.addEventListener("message", (event) => {
  if (event.data?.type === "PARALLAX_PROGRESS") {
    const progress = Math.max(
      0,
      Math.min(1, Number(event.data.progress) || 0)
    );

    targetFrame = progress * (TOTAL_FRAMES - 1);
  }
});

window.addEventListener("resize", render);
animate();
</script>
</body>
</html>
