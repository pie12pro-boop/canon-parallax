
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>FlyGarden | Parallax Universal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101010;
    }

    body {
      font-family: Arial, sans-serif;
    }

    #camera {
      display: block;
      width: 100%;
      height: 100%;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 12px;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    #controles {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: min(80%, 500px);
      display: none;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
      border-radius: 15px;
      background: rgba(20, 20, 20, 0.8);
      backdrop-filter: blur(12px);
      z-index: 20;
    }

    #testeScroll {
      width: 100%;
      cursor: pointer;
      accent-color: white;
    }

    #contador {
      color: white;
      font-size: 12px;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <canvas id="camera"></canvas>

  <div id="status">Carregando...</div>

  <div id="controles">
    <input
      id="testeScroll"
      type="range"
      min="0"
      max="99"
      value="0"
      step="1"
    >

    <span id="contador">1 / 100</span>
  </div>

  <script>

    // ======================================
    // CONFIGURAÇÃO DOS PRODUTOS
    // ======================================

    const PRODUCTS = {

      canon: {
        folder: ".",
        prefix: "Imagem-",
        count: 100,
        ext: "webp"
      },

      drone: {
        folder: "drone",
        prefix: "Imagem-",
        count: 100,
        ext: "webp"
      }

    };

    // ======================================
    // IDENTIFICAR PRODUTO PELA URL
    // ======================================

    const params = new URLSearchParams(
      window.location.search
    );

    const productName =
      params.get("produto") || "canon";

    const TEST_MODE =
      params.get("teste") === "1";

    const product =
      Object.prototype.hasOwnProperty.call(
        PRODUCTS,
        productName
      )
        ? PRODUCTS[productName]
        : PRODUCTS.canon;

    const TOTAL_FRAMES = product.count;

    // ======================================
    // ELEMENTOS
    // ======================================

    const canvas =
      document.getElementById("camera");

    const ctx =
      canvas.getContext("2d");

    const slider =
      document.getElementById("testeScroll");

    const contador =
      document.getElementById("contador");

    const status =
      document.getElementById("status");

    const controles =
      document.getElementById("controles");

    const frames =
      new Array(TOTAL_FRAMES);

    let currentFrame = 0;
    let targetFrame = 0;

    let loadedFrames = 0;
    let failedFrames = 0;

    let lastRenderedFrame = -1;

    // ======================================
    // MODO TESTE
    // ======================================

    if (TEST_MODE) {
      controles.style.display = "flex";
    }

    slider.max = TOTAL_FRAMES - 1;

    contador.textContent =
      `1 / ${TOTAL_FRAMES}`;

    // ======================================
    // CAMINHO DOS ARQUIVOS
    // ======================================

    function getFramePath(number) {

      const filename =
        `${product.prefix}${number}.${product.ext}`;

      if (
        product.folder === "." ||
        product.folder === ""
      ) {
        return filename;
      }

      return `${product.folder}/${filename}`;
    }

    // ======================================
    // CARREGAR IMAGENS
    // ======================================

    function loadFrames() {

      for (
        let i = 1;
        i <= TOTAL_FRAMES;
        i++
      ) {

        const img = new Image();

        frames[i - 1] = img;

        img.onload = () => {

          loadedFrames++;

          updateStatus();

          if (i === 1) {
            render();
          }

        };

        img.onerror = () => {

          failedFrames++;

          console.error(
            "Erro ao carregar:",
            getFramePath(i)
          );

          updateStatus();

        };

        img.src = getFramePath(i);

      }

    }

    // ======================================
    // STATUS DE CARREGAMENTO
    // ======================================

    function updateStatus() {

      const processed =
        loadedFrames + failedFrames;

      if (processed === TOTAL_FRAMES) {

        if (failedFrames === 0) {
          status.textContent = "";
        } else {
          status.textContent =
            `${failedFrames} imagens não carregadas`;
        }

      } else {

        status.textContent =
          `Carregando ${processed} / ${TOTAL_FRAMES}`;

      }

    }

    // ======================================
    // DIMENSIONAMENTO DO CANVAS
    // ======================================

    function resizeCanvas() {

      const width = canvas.clientWidth;
      const height = canvas.clientHeight;

      const dpr = Math.min(
        window.devicePixelRatio || 1,
        2
      );

      const pixelWidth =
        Math.round(width * dpr);

      const pixelHeight =
        Math.round(height * dpr);

      if (
        canvas.width !== pixelWidth ||
        canvas.height !== pixelHeight
      ) {

        canvas.width = pixelWidth;
        canvas.height = pixelHeight;

        lastRenderedFrame = -1;

      }

    }

    // ======================================
    // DESENHAR FRAME
    // ======================================

    function render() {

      resizeCanvas();

      const width = canvas.clientWidth;
      const height = canvas.clientHeight;

      if (width <= 0 || height <= 0) {
        return;
      }

      const index = Math.max(
        0,
        Math.min(
          TOTAL_FRAMES - 1,
          Math.round(currentFrame)
        )
      );

      const img = frames[index];

      if (
        !img ||
        !img.complete ||
        !img.naturalWidth
      ) {
        return;
      }

      if (index === lastRenderedFrame) {
        return;
      }

      const dpr = Math.min(
        window.devicePixelRatio || 1,
        2
      );

      ctx.setTransform(
        dpr, 0, 0, dpr, 0, 0
      );

      ctx.clearRect(
        0, 0, width, height
      );

      const scale = Math.min(
        width / img.naturalWidth,
        height / img.naturalHeight
      );

      const w =
        img.naturalWidth * scale;

      const h =
        img.naturalHeight * scale;

      ctx.drawImage(
        img,
        (width - w) / 2,
        (height - h) / 2,
        w,
        h
      );

      lastRenderedFrame = index;

      contador.textContent =
        `${index + 1} / ${TOTAL_FRAMES}`;

    }

    // ======================================
    // ANIMAÇÃO SUAVE
    // ======================================

    function animate() {

      currentFrame +=
        (targetFrame - currentFrame) * 0.18;

      if (
        Math.abs(
          targetFrame - currentFrame
        ) < 0.05
      ) {

        currentFrame = targetFrame;

      }

      render();

      requestAnimationFrame(animate);

    }

    // ======================================
    // CONTROLE MANUAL
    // ======================================

    slider.addEventListener(
      "input",
      function () {

        targetFrame =
          Number(this.value);

      }
    );

    // ======================================
    // CONTROLE PELO WIX
    // ======================================

    window.addEventListener(
      "message",
      (event) => {

        if (
          event.data?.type ===
          "PARALLAX_PROGRESS"
        ) {

          const value =
            Number(event.data.progress);

          if (!Number.isFinite(value)) {
            return;
          }

          const progress = Math.max(
            0,
            Math.min(1, value)
          );

          targetFrame =
            progress * (TOTAL_FRAMES - 1);

          slider.value =
            Math.round(targetFrame);

        }

      }
    );

    // ======================================
    // REDIMENSIONAMENTO
    // ======================================

    window.addEventListener(
      "resize",
      () => {

        lastRenderedFrame = -1;
        render();

      }
    );

    // ======================================
    // INICIAR
    // ======================================

    loadFrames();

    animate();

  </script>

</body>
</html>
